spring:
  application:
    name: credit-service
  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: http://localhost:8001

server:
  port: 8002

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

#logging:
#  level:
#    root: trace

springdoc:
  swagger-ui:
    oauth:
      use-basic-authentication-with-access-code-grant: true